<!doctype html><html><head><meta charset="utf-8"><title>Boxglow logo candidates</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
 body { margin: 0; padding: 24px; font-family: "Nunito", "M PLUS Rounded 1c", sans-serif; background: #f2f4f6; color: #2f343a; width: 1180px; }
 h1 { font-size: 20px; margin: 0 0 12px; }
 h2 { font-size: 16px; margin: 20px 0 8px; } small { font-weight: 400; color: #6b7075; margin-left: 10px; }
 .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
 .bg { display: flex; align-items: center; gap: 18px; padding: 16px; border-radius: 12px; border: 2px solid #c9ced4; }
 .light { background: #fbfbfb; } .dark { background: #15181b; }
 .word { justify-content: center; } .wm { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
 .dark .wm { color: #e8eaed; }
</style></head><body>
<h1>Boxglow ロゴ案 (512 / 64 / 32 / 16 px、ライト / ダーク、ワードマーク付き)</h1>

    <section>
      <h2>A. Glow box <small>1 つの箱が黒から白へ。完了 = 光る</small></h2>
      <div class="row">
        <div class="bg light"><img src="logo_a_glowbox.svg" width="160"><img src="logo_a_glowbox.svg" width="64"><img src="logo_a_glowbox.svg" width="32"><img src="logo_a_glowbox.svg" width="16"></div>
        <div class="bg dark"><img src="logo_a_glowbox.svg" width="160"><img src="logo_a_glowbox.svg" width="64"><img src="logo_a_glowbox.svg" width="32"><img src="logo_a_glowbox.svg" width="16"></div>
        <div class="bg light word"><img src="logo_a_glowbox.svg" width="40"><span class="wm">Boxglow</span></div>
        <div class="bg dark word"><img src="logo_a_glowbox.svg" width="40"><span class="wm">Boxglow</span></div>
      </div>
    </section>
    <section>
      <h2>B. Flow <small>黒 -> 斜線 -> 白 の 3 箱を線でつなぐ</small></h2>
      <div class="row">
        <div class="bg light"><img src="logo_b_flow.svg" width="160"><img src="logo_b_flow.svg" width="64"><img src="logo_b_flow.svg" width="32"><img src="logo_b_flow.svg" width="16"></div>
        <div class="bg dark"><img src="logo_b_flow.svg" width="160"><img src="logo_b_flow.svg" width="64"><img src="logo_b_flow.svg" width="32"><img src="logo_b_flow.svg" width="16"></div>
        <div class="bg light word"><img src="logo_b_flow.svg" width="40"><span class="wm">Boxglow</span></div>
        <div class="bg dark word"><img src="logo_b_flow.svg" width="40"><span class="wm">Boxglow</span></div>
      </div>
    </section>
    <section>
      <h2>C. b mark <small>小文字 b = 配線 + 光る箱</small></h2>
      <div class="row">
        <div class="bg light"><img src="logo_c_mark_b.svg" width="160"><img src="logo_c_mark_b.svg" width="64"><img src="logo_c_mark_b.svg" width="32"><img src="logo_c_mark_b.svg" width="16"></div>
        <div class="bg dark"><img src="logo_c_mark_b.svg" width="160"><img src="logo_c_mark_b.svg" width="64"><img src="logo_c_mark_b.svg" width="32"><img src="logo_c_mark_b.svg" width="16"></div>
        <div class="bg light word"><img src="logo_c_mark_b.svg" width="40"><span class="wm">Boxglow</span></div>
        <div class="bg dark word"><img src="logo_c_mark_b.svg" width="40"><span class="wm">Boxglow</span></div>
      </div>
    </section>
</body></html>
