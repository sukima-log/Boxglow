<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxglow</title>
    <meta name="description" content="Boxglow: AI エージェントとチームの作業を、ボックスと線で一目で。計画を入出力付きのブロック図にして進捗を共有する、ブラウザで動くツール。" />
    <meta property="og:title" content="Boxglow" />
    <meta property="og:description" content="AI エージェントとチームの作業を、ボックスと線で一目で。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="すきま研究所日誌" />
    <meta name="theme-color" content="#eceef0" />
    <!-- アプリのアイコン (public/ の自前のロゴ。SVG を優先し、古い環境は ico) -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet" />
    <script>
      // 画面が描かれる前にテーマを当てる (ちらつき防止)。本体の初期化は src/lib/theme.ts
      (function () {
        try {
          var saved = localStorage.getItem("boxglow:theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Boxglow needs JavaScript. / Boxglow は JavaScript が有効なブラウザで動きます。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
